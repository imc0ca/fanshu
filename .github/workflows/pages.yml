name: Validate and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run story:validate
      - run: npm run story:test
      - run: npm run build
      - name: Include Dongchan's phone in the same Pages site
        run: |
          mkdir -p dist/dongchan
          curl --fail --location --retry 3 --max-time 180 --output dist/dongchan/index.html \
            https://raw.githubusercontent.com/imyum1/foundphone-fanshu/main/index.html
          test -s dist/dongchan/index.html
          node scripts/optimize-dongchan.mjs
          node scripts/inject-dongchan-switch.mjs
          mkdir -p dist/dongchan/camera-photo
          cp public/dongchan-camera/photo.jpg dist/dongchan/camera-photo/photo.jpg 2>/dev/null || true
          node scripts/inject-dongchan-camera.mjs
          echo "Dongchan page size: $(wc -c < dist/dongchan/index.html) bytes"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
